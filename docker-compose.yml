services:
  auszeit:
    build: .
    container_name: auszeit_app
    ports:
      - "4000:4000"
      # Verwaltung. Vorgabe 127.0.0.1: nur auf dem Rechner selbst erreichbar.
      # AUSZEIT_ADMIN_BIND=0.0.0.0 oeffnet sie fuers Hausnetz. Der Tunnel
      # veroeffentlicht ausschliesslich Port 4000, nie diesen hier.
      - "${AUSZEIT_ADMIN_BIND:-127.0.0.1}:${AUSZEIT_ADMIN_PORT:-4001}:${AUSZEIT_ADMIN_PORT:-4001}"
    environment:
      TZ: Europe/Berlin
      PORT: 4000
      # Mandanten. Ohne Angabe laeuft die App als Einzelinstallation fuer eine
      # Schule und verhaelt sich wie bisher. Werte kommen aus einer .env-Datei
      # neben dieser Compose-Datei, damit echte Schulnamen nicht im Repo landen.
      AUSZEIT_SCHULEN: ${AUSZEIT_SCHULEN:-}
      AUSZEIT_STANDARD_SCHULE: ${AUSZEIT_STANDARD_SCHULE:-}
      AUSZEIT_ORIGIN: ${AUSZEIT_ORIGIN:-}
      # Verwaltung. Ohne Token bleibt sie abgeschaltet. Mit AUSZEIT_ADMIN_PORT
      # laeuft sie auf einem eigenen, nicht veroeffentlichten Port.
      AUSZEIT_ADMIN_TOKEN: ${AUSZEIT_ADMIN_TOKEN:-}
      AUSZEIT_ADMIN_PORT: ${AUSZEIT_ADMIN_PORT:-}
    volumes:
      # Die Mandanten muessen den naechsten Build ueberleben - bis hierher war
      # die App bewusst vergesslich.
      - ./daten:/app/daten
    restart: unless-stopped
